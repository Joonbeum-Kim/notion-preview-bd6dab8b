<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta property="og:type" content="website"/>
<meta property="og:title" content="Notion Code Preview"/>
<meta property="og:description" content="Built with Notion Code Previewer"/>
<meta property="og:image" content="https://Joonbeum-Kim.github.io/notion-preview-bd6dab8b/og-image.png"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:image" content="https://Joonbeum-Kim.github.io/notion-preview-bd6dab8b/og-image.png"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2032%2032'%3E%3Crect%20width%3D'32'%20height%3D'32'%20rx%3D'6'%20fill%3D'%25236366f1'%2F%3E%3Ctext%20x%3D'16'%20y%3D'22'%20text-anchor%3D'middle'%20font-size%3D'18'%20fill%3D'white'%20font-family%3D'sans-serif'%3EN%3C%2Ftext%3E%3C%2Fsvg%3E"/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Courier New', 'Menlo', monospace;
  background: radial-gradient(ellipse at top, #3a2416 0%, #1a0f0a 60%, #0a0604 100%);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px; color: #f0e6d2; overflow: hidden;
}
.game-wrap {
  width: 100%; max-width: 760px;
  background: linear-gradient(145deg, #2a1a10, #1a0e08);
  border: 4px double #c9a87c; border-radius: 8px; padding: 20px;
  box-shadow: 0 0 0 2px #1a0e08, 0 0 0 4px #8b6a3f, 0 20px 60px rgba(0,0,0,0.7);
}
.hud { display: flex; justify-content: space-around; gap: 12px; padding: 10px; margin-bottom: 16px; background: #0f0604; border: 2px solid #8b6a3f; border-radius: 4px; flex-wrap: wrap; }
.stat { display: flex; flex-direction: column; align-items: center; min-width: 70px; }
.stat-label { font-size: 10px; letter-spacing: 2px; color: #c9a87c; opacity: 0.7; }
.stat-val { font-size: 18px; font-weight: 700; color: #ffd87a; text-shadow: 0 0 8px rgba(255,216,122,0.5); }
#lives { color: #e54c4c; font-size: 14px; }
.board-wrap { position: relative; width: 100%; aspect-ratio: 3/2; background: #1a0e08; border: 3px solid #8b6a3f; border-radius: 4px; overflow: hidden; }
#game { display: block; width: 100%; height: 100%; cursor: crosshair; }
.overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: rgba(10,6,4,0.92); text-align: center; padding: 20px; z-index: 10; }
.overlay.hidden { display: none; }
.overlay h1 { font-size: clamp(28px, 5vw, 44px); color: #ffd87a; letter-spacing: 4px; text-shadow: 0 0 12px rgba(255,216,122,0.6), 3px 3px 0 #8b2d1f; }
.overlay p { font-size: 14px; line-height: 1.8; color: #f0e6d2; }
.record { color: #ffd87a !important; font-size: 18px !important; font-weight: bold; }
.record.hidden { display: none; }
.btn { font-family: inherit; font-size: 16px; font-weight: 700; letter-spacing: 3px; padding: 14px 36px; background: linear-gradient(180deg, #d4a058, #8b6a3f); color: #1a0e08; border: 3px solid #1a0e08; border-radius: 4px; cursor: pointer; box-shadow: 0 4px 0 #5a4427; }
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(2px); }
.toast { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); padding: 10px 22px; background: #8b2d1f; border: 2px solid #ffd87a; border-radius: 4px; color: #ffd87a; font-weight: 700; letter-spacing: 2px; font-size: 13px; z-index: 20; }
.toast.hidden { display: none; }
.hint { margin-top: 14px; font-size: 12px; text-align: center; color: #c9a87c; opacity: 0.7; }
.hint b { color: #ffd87a; }
</style>
</head><body><div class="game-wrap">
  <header class="hud">
    <div class="stat"><span class="stat-label">SCORE</span><span id="score" class="stat-val">0</span></div>
    <div class="stat"><span class="stat-label">LIVES</span><span id="lives" class="stat-val">HP x 10</span></div>
    <div class="stat"><span class="stat-label">TIME</span><span id="time" class="stat-val">0s</span></div>
    <div class="stat"><span class="stat-label">BEST</span><span id="best" class="stat-val">0</span></div>
  </header>
  <div class="board-wrap">
    <canvas id="game" width="720" height="480"></canvas>
    <div id="startScreen" class="overlay">
      <h1>🎯 RETRO DARTS</h1>
      <p>클릭 + 드래그로 당겨서 쏘세요<br>과녁을 놓치면 목숨 -1 · 60초마다 난이도 UP</p>
      <button id="startBtn" class="btn">START</button>
    </div>
    <div id="gameOverScreen" class="overlay hidden">
      <h1>GAME OVER</h1>
      <p>최종 점수: <span id="finalScore">0</span></p>
      <p id="newRecord" class="record hidden">🏆 NEW RECORD!</p>
      <button id="restartBtn" class="btn">RESTART</button>
    </div>
    <div id="buffToast" class="toast hidden"></div>
  </div>
  <p class="hint">💡 마우스를 <b>누른 채로</b> 당겨서 힘을 모으고, <b>놓으면</b> 다트가 반대방향으로 날아갑니다.</p>
</div><script>
(function(){
  var W, H, ctx, canvas;
  var scoreEl, livesEl, timeEl, bestEl, startScreen, gameOverScreen, startBtn, restartBtn, finalScoreEl, newRecordEl, buffToast;
  var state = 'idle';
  var score = 0, lives = 10, startTime = 0, elapsed = 0;
  var targets = [], darts = [], particles = [];
  var lastSpawn = 0, spawnInterval = 1400;
  var sizeMult = 1, speedMult = 1, buffCount = 0;
  var aiming = false, aimStart = null, aimCurrent = null;
  var audioCtx = null, lastBuffTier = 0, lastT = 0, best = 0;
  var mem = {};

  function byId(id){ return document.getElementById(id); }
  function storeGet(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k]; } }
  function storeSet(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k]=String(v); } }

  function beep(f,d,t){
    f = f||660; d = d||0.08; t = t||'square';
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = t; o.frequency.value = f;
      g.gain.setValueAtTime(0.15, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+d);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime+d);
    } catch(e){}
  }
  function sfxHit(){ beep(880,0.06); setTimeout(function(){ beep(1320,0.08); }, 40); }
  function sfxMiss(){ beep(180,0.2,'sawtooth'); }
  function sfxThrow(){ beep(440,0.04,'triangle'); }
  function sfxBuff(){ beep(520,0.08); setTimeout(function(){ beep(780,0.08); },90); setTimeout(function(){ beep(1040,0.12); },180); }

  function spawnTarget(){
    var moving = Math.random() < 0.5;
    var r = (28 + Math.random()*18) * sizeMult;
    var t = { x: moving ? -r : 60+Math.random()*(W-120), y: 60+Math.random()*(H-120), r: r, moving: moving, vx:0, vy:0, life: moving?Infinity:2200+Math.random()*800, age:0, dead:false, hit:false };
    if (moving){ var dir = Math.random()<0.5?1:-1; t.vx = (1.5+Math.random()*2)*speedMult*dir; if (dir<0) t.x = W+r; }
    targets.push(t);
  }

  function drawBoard(t){
    var x=t.x, y=t.y, r=t.r;
    ctx.save();
    ctx.fillStyle='#1a0e08'; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#e8d9a8'; ctx.beginPath(); ctx.arc(x,y,r*0.85,0,Math.PI*2); ctx.fill();
    for (var i=0;i<10;i++){
      var a1=(i/10)*Math.PI*2, a2=((i+1)/10)*Math.PI*2;
      ctx.fillStyle = (i%2===0) ? '#8b2d1f' : '#2a4a2a';
      ctx.beginPath(); ctx.moveTo(x,y); ctx.arc(x,y,r*0.75,a1,a2); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle='#e8d9a8'; ctx.beginPath(); ctx.arc(x,y,r*0.4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#2a4a2a'; ctx.beginPath(); ctx.arc(x,y,r*0.3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#8b2d1f'; ctx.beginPath(); ctx.arc(x,y,r*0.15,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#0a0604'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke();
    if (!t.moving && t.life !== Infinity){
      var remain = t.life - t.age;
      if (remain < 600){ ctx.fillStyle='rgba(10,6,4,'+(1-remain/600)+')'; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
    }
    ctx.restore();
  }

  function drawDart(d){
    ctx.save(); ctx.translate(d.x,d.y); ctx.rotate(Math.atan2(d.vy,d.vx));
    ctx.fillStyle='#c9a87c'; ctx.fillRect(-14,-1.5,20,3);
    ctx.fillStyle='#e8d9a8'; ctx.beginPath(); ctx.moveTo(6,0); ctx.lineTo(12,-3); ctx.lineTo(12,3); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#8b2d1f'; ctx.beginPath(); ctx.moveTo(-14,0); ctx.lineTo(-20,-5); ctx.lineTo(-18,0); ctx.lineTo(-20,5); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function burst(x,y,c,n){
    c = c||'#ffd87a'; n = n||14;
    for (var i=0;i<n;i++){
      var a = Math.random()*Math.PI*2, s = 2+Math.random()*4;
      particles.push({ x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, color:c });
    }
  }

  function getMouse(e){
    var rect = canvas.getBoundingClientRect();
    return { x:(e.clientX-rect.left)*(W/rect.width), y:(e.clientY-rect.top)*(H/rect.height) };
  }

  function showToast(msg){
    buffToast.textContent = msg; buffToast.classList.remove('hidden');
    setTimeout(function(){ buffToast.classList.add('hidden'); }, 2400);
  }
  function applyBuff(){
    buffCount++;
    if (Math.random()<0.5){ sizeMult *= 0.85; showToast('SIZE DOWN LV.'+buffCount); }
    else { speedMult *= 1.25; showToast('SPEED UP LV.'+buffCount); }
    sfxBuff();
  }
  function updateHUD(){
    scoreEl.textContent = score;
    livesEl.textContent = 'HP x '+Math.max(0,lives);
    timeEl.textContent = Math.floor(elapsed/1000)+'s';
  }
  function reset(){
    score=0; lives=10; elapsed=0; lastBuffTier=0;
    startTime = (typeof performance!=='undefined'?performance.now():Date.now());
    targets=[]; darts=[]; particles=[]; lastSpawn=0; spawnInterval=1400;
    sizeMult=1; speedMult=1; buffCount=0; aiming=false;
    updateHUD();
  }
  function startGame(){
    reset(); state='playing';
    startScreen.classList.add('hidden'); gameOverScreen.classList.add('hidden');
  }
  function endGame(){
    state='over'; finalScoreEl.textContent = score;
    if (score > best){ best = score; storeSet('dartsBest', best); bestEl.textContent = best; newRecordEl.classList.remove('hidden'); }
    else { newRecordEl.classList.add('hidden'); }
    gameOverScreen.classList.remove('hidden'); sfxMiss();
  }
  function filterAlive(arr, key, cmp){
    var out = [];
    for (var i=0;i<arr.length;i++){
      if (cmp === undefined){ if (!arr[i][key]) out.push(arr[i]); }
      else { if (arr[i][key] > cmp) out.push(arr[i]); }
    }
    return out;
  }

  function loop(now){
    if (!lastT) lastT = now;
    var dt = now - lastT; lastT = now;
    ctx.fillStyle='#1a0e08'; ctx.fillRect(0,0,W,H);
    if (state === 'playing'){
      elapsed = now - startTime;
      var tier = Math.floor(elapsed/60000);
      if (tier > lastBuffTier){ lastBuffTier = tier; applyBuff(); spawnInterval = Math.max(600, spawnInterval*0.9); }
      if (now - lastSpawn > spawnInterval){ spawnTarget(); lastSpawn = now; }
      for (var ti=0; ti<targets.length; ti++){
        var t = targets[ti];
        if (t.moving){ t.x += t.vx; if (t.x < -t.r-50 || t.x > W+t.r+50) t.dead = true; }
        else { t.age += dt; if (t.age > t.life) t.dead = true; }
      }
      for (var di=0; di<darts.length; di++){
        var d = darts[di];
        d.x += d.vx; d.y += d.vy; d.vy += 0.25; d.life -= 1;
        if (d.life<=0 || d.x<-30 || d.x>W+30 || d.y>H+30){
          if (!d.hit){ lives--; burst(d.x, Math.min(d.y,H-10), '#8b2d1f', 8); sfxMiss(); if (lives<=0) endGame(); }
          d.dead = true;
        }
        if (!d.hit){
          for (var mi=0; mi<targets.length; mi++){
            var tg = targets[mi];
            if (tg.dead || tg.hit) continue;
            var rdx = d.x-tg.x, rdy = d.y-tg.y;
            if (rdx*rdx + rdy*rdy < tg.r*tg.r){
              d.hit=true; tg.hit=true; tg.dead=true;
              var rd = Math.hypot(rdx,rdy), pts = 10;
              if (rd < tg.r*0.15) pts = 100;
              else if (rd < tg.r*0.3) pts = 50;
              else if (rd < tg.r*0.4) pts = 30;
              score += pts; burst(tg.x, tg.y, '#ffd87a', 18); sfxHit();
              particles.push({ x:tg.x, y:tg.y, vx:0, vy:-1.5, life:1.2, color:'#ffd87a', text:'+'+pts });
              break;
            }
          }
        }
      }
      for (var pi=0; pi<particles.length; pi++){ var pp = particles[pi]; pp.x += pp.vx; pp.y += pp.vy; pp.vy += 0.1; pp.life -= 0.025; }
      targets = filterAlive(targets, 'dead');
      darts = filterAlive(darts, 'dead');
      particles = filterAlive(particles, 'life', 0);
      updateHUD();
    }
    for (var a=0; a<targets.length; a++) drawBoard(targets[a]);
    for (var b=0; b<darts.length; b++) drawDart(darts[b]);
    for (var c=0; c<particles.length; c++){
      var p = particles[c];
      ctx.save(); ctx.globalAlpha = Math.max(0, p.life);
      if (p.text){ ctx.fillStyle = p.color; ctx.font = 'bold 18px monospace'; ctx.textAlign = 'center'; ctx.fillText(p.text, p.x, p.y); }
      else { ctx.fillStyle = p.color; ctx.fillRect(p.x-2, p.y-2, 4, 4); }
      ctx.restore();
    }
    if (aiming && aimStart && aimCurrent){
      var adx = aimStart.x - aimCurrent.x, ady = aimStart.y - aimCurrent.y;
      var adist = Math.hypot(adx, ady);
      ctx.strokeStyle = 'rgba(201,168,124,0.5)'; ctx.setLineDash([4,4]); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(aimStart.x, aimStart.y); ctx.lineTo(aimCurrent.x, aimCurrent.y); ctx.stroke();
      ctx.setLineDash([]);
      var aln = adist || 1, ax = aimStart.x + (adx/aln)*40, ay = aimStart.y + (ady/aln)*40;
      ctx.strokeStyle = '#ffb060'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(aimStart.x, aimStart.y); ctx.lineTo(ax, ay); ctx.stroke();
    }
    requestAnimationFrame(loop);
  }

  function boot(){
    canvas = byId('game');
    if (!canvas){ setTimeout(boot, 50); return; }
    ctx = canvas.getContext('2d');
    W = canvas.width; H = canvas.height;
    scoreEl = byId('score'); livesEl = byId('lives'); timeEl = byId('time'); bestEl = byId('best');
    startScreen = byId('startScreen'); gameOverScreen = byId('gameOverScreen');
    startBtn = byId('startBtn'); restartBtn = byId('restartBtn');
    finalScoreEl = byId('finalScore'); newRecordEl = byId('newRecord'); buffToast = byId('buffToast');
    best = +(storeGet('dartsBest') || 0); bestEl.textContent = best;
    canvas.addEventListener('mousedown', function(e){ if (state!=='playing') return; aiming=true; aimStart=getMouse(e); aimCurrent=aimStart; });
    canvas.addEventListener('mousemove', function(e){ if (!aiming) return; aimCurrent=getMouse(e); });
    canvas.addEventListener('mouseup', function(e){
      if (!aiming || state!=='playing'){ aiming=false; return; }
      var end = getMouse(e), dx = aimStart.x-end.x, dy = aimStart.y-end.y, dist = Math.hypot(dx,dy);
      if (dist < 10){ aiming=false; return; }
      var power = Math.min(dist/20, 22), ln = dist || 1;
      darts.push({ x:aimStart.x, y:aimStart.y, vx:(dx/ln)*power, vy:(dy/ln)*power, life:90, hit:false });
      sfxThrow(); aiming=false;
    });
    canvas.addEventListener('mouseleave', function(){ aiming=false; });
    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);
    requestAnimationFrame(loop);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body></html>
